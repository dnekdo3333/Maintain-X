# Optional local infrastructure for machines WITHOUT a native PostgreSQL install.
# The primary dev machine runs PostgreSQL 18 as a Windows service, so this file is
# only needed for CI-like setups or other developers.
#
#   docker compose up -d
#
services:
  postgres:
    image: postgres:16-alpine
    container_name: maintainx-postgres
    environment:
      POSTGRES_USER: maintainx
      POSTGRES_PASSWORD: maintainx
      POSTGRES_DB: maintainx
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U maintainx']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage, used when STORAGE_DRIVER=s3.
  minio:
    image: minio/minio:latest
    container_name: maintainx-minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
